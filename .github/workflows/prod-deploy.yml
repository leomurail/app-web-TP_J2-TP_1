name: Prod Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create destination directory
        run: mkdir -p /home/ubuntu/prod

      - name: Sync files
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            ./ /home/ubuntu/prod/

      - name: Initialize Environment
        run: |
          cd /home/ubuntu/prod
          task install
        env:
          APP_ENV: prod
