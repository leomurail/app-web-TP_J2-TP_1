name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Run tests
        run: npm run test

  deploy:
    name: Deployment
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Target Environment
        id: target
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
          fi

      - name: Create destination directory
        run: mkdir -p ~/${{ steps.target.outputs.env }}/${{ secrets.SSH_PATH }}

      - name: Sync files
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            ./ ~/${{ steps.target.outputs.env }}/${{ secrets.SSH_PATH }}

      - name: Remote Deployment
        run: |
          cd ~/${{ steps.target.outputs.env }}/${{ secrets.SSH_PATH }}
          # On utilise les commandes prod:* pour le serveur
          task prod:install ENV=${{ steps.target.outputs.env }}
          task prod:deploy
