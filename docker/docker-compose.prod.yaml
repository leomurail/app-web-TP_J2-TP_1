services:
  app:
    networks:
      - traefik_proxy
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.whoami.rule=Host(`${APP_DOMAIN}`)"
        - "traefik.http.routers.whoami.entrypoints=websecure"
        - "traefik.http.routers.whoami.tls=true"
        - traefik.http.services.whoami.loadbalancer.server.port=${APP_PORT}

networks:
  traefik_proxy:
    driver: overlay
    attachable: true
